# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair entrance screen in source
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "GRASS_ENTRANCE_RUNTIME_FIX_V2"
          if marker not in text:
              fix = r'''<style id="grass-entrance-runtime-fix-v2">
          /* GRASS_ENTRANCE_RUNTIME_FIX_V2 */
          #cloak-screen > .entrance-screen.grass-entrance-visible { display:block !important; }
          </style>
          <script id="grass-entrance-runtime-fix-v2">
          (function(){
            function showEntrance(){
              var cloak=document.getElementById('cloak-screen');
              if(!cloak)return;
              var saved=localStorage.getItem('grass_entrance');
              var choice=(saved==='ixl'||saved==='blooket') ? saved : 'blooket';
              var screens={blooket:document.getElementById('entrance-blooket'),ixl:document.getElementById('entrance-ixl')};
              Object.keys(screens).forEach(function(key){
                var el=screens[key];
                if(!el)return;
                el.classList.toggle('grass-entrance-visible',key===choice);
                el.setAttribute('aria-hidden',key===choice?'false':'true');
              });
              cloak.style.display='block';
              cloak.style.visibility='visible';
              cloak.style.opacity='1';
              if(document.body) document.body.dataset.disguise=choice;
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',showEntrance,{once:true});
            else showEntrance();
          })();
          </script>
          '''
              if "</body>" in text:
                  text = text.replace("</body>", fix + "</body>", 1)
              else:
                  text += fix
              path.write_text(text, encoding="utf-8")
          PY

      - name: Commit source repair if needed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Fix Grass entrance screen"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
